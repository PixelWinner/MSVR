<!DOCTYPE html>
<html lang="ua"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#2</title>
<style>
    body {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        background-color: #EEEEEE;
        font-family: Arial, sans-serif;
    }
    
    .controls-panel {
        background-color: #f9f9f9;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        max-width: 600px;
    }
    
    .control-group {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        gap: 10px;
    }
    
    .control-group label {
        min-width: 180px;
        font-weight: bold;
        color: #333;
    }
    
    .control-group input[type="range"] {
        flex: 1;
        margin: 0 10px;
    }
    
    .control-group input[type="number"] {
        width: 80px;
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    
    .controls-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #333;
        border-bottom: 2px solid #007acc;
        padding-bottom: 5px;
    }
    
    .phone-controls {
        background-color: #f0f8ff;
        border: 1px solid #007acc;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
    }
    
    .text-input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 10px;
        font-family: monospace;
    }
    
    .button-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    
    .action-button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background-color: #007acc;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }
    
    .action-button:hover {
        background-color: #005a99;
    }
    
    .action-button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }
    
    .connection-status {
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .connected {
        color: #28a745;
    }
    
    .sensor-value-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 10px;
    }
    
    .sensor-value-item {
        display: flex;
        justify-content: space-between;
        padding: 5px;
        background-color: #f8f9fa;
        border-radius: 4px;
    }
    
    .sensor-label {
        font-weight: bold;
    }
    
    .sensor-value {
        font-family: monospace;
        color: #007acc;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.js"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<div class="controls-panel">
    <div class="controls-title">Керування стереокамерою</div>
    
    <div class="control-group">
        <label for="eyeSeparation">Відстань між очима:</label>
        <input type="range" id="eyeSeparation" min="0.1" max="2.0" step="0.1" value="0.7">
        <input type="number" id="eyeSeparationValue" min="0.1" max="2.0" step="0.1" value="0.7">
    </div>
    
    <div class="control-group">
        <label for="convergence">Конвергенція:</label>
        <input type="range" id="convergence" min="5.0" max="30.0" step="0.5" value="14.0">
        <input type="number" id="convergenceValue" min="5.0" max="30.0" step="0.5" value="14.0">
    </div>
    
    <div class="control-group">
        <label for="aspectRatio">Співвідношення сторін:</label>
        <input type="range" id="aspectRatio" min="0.5" max="3.0" step="0.1" value="1.3">
        <input type="number" id="aspectRatioValue" min="0.5" max="3.0" step="0.1" value="1.3">
    </div>
    
    <div class="control-group">
        <label for="fov">Поле зору (радіани):</label>
        <input type="range" id="fov" min="0.1" max="1.5" step="0.05" value="0.4">
        <input type="number" id="fovValue" min="0.1" max="1.5" step="0.05" value="0.4">
    </div>
    
    <div class="phone-controls">
        <div class="controls-title">Підключення до телефону</div>
        
        <label for="wsUrl">WebSocket URL:</label>
        <input type="text" id="wsUrl" class="text-input" value="ws://192.168.31.19:8080/sensor/connect?type=android.sensor.game_rotation_vector">
        
        <div class="button-row">
            <button id="connectBtn" class="action-button">Підключити</button>
            <button id="disconnectBtn" class="action-button" disabled>Відключити</button>
        </div>
        
        <div class="connection-status">
            Статус: <span id="connectionStatus">Відключено</span>
        </div>
        
        <div class="controls-title" style="margin-top: 15px; font-size: 16px;">Значення сенсорів (Кватерніон)</div>
        <div class="sensor-value-grid">
            <div class="sensor-value-item">
                <span class="sensor-label">X:</span>
                <span id="sensorValueX" class="sensor-value">0.00</span>
            </div>
            <div class="sensor-value-item">
                <span class="sensor-label">Y:</span>
                <span id="sensorValueY" class="sensor-value">0.00</span>
            </div>
            <div class="sensor-value-item">
                <span class="sensor-label">Z:</span>
                <span id="sensorValueZ" class="sensor-value">0.00</span>
            </div>
            <div class="sensor-value-item">
                <span class="sensor-label">W:</span>
                <span id="sensorValueW" class="sensor-value">0.00</span>
            </div>
        </div>
    </div>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>


</body></html>
